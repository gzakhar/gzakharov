---
layout: default
---
<article>
    <header class="post-header">
        <div class="post-meta">
            <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
            <div class="post-tags">
                {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
            </div>
        </div>
        <h1 class="post-title">{{ page.title }}</h1>
    </header>

    <div class="post-body">
        {{ content }}
    </div>

    <a href="{{ '/ideas.html' | relative_url }}" class="back-link" target="_self">&larr; back to ideas</a>
</article>
