<nav class="site-nav">
    <a href="{{ '/index.html' | relative_url }}" target="_self"{% if page.url == '/' or page.url == '/index.html' %} class="active"{% endif %}>portfolio</a>
    <a href="{{ '/ideas.html' | relative_url }}" target="_self"{% if page.url contains '/ideas' %} class="active"{% endif %}>ideas</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
        </svg>
        <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="12" rx="1.5"></rect>
            <path d="M8 20h8M12 16v4"></path>
        </svg>
    </button>
</nav>

<script>
(function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;

    var MODES = ['system', 'light', 'dark'];
    var LABELS = { system: 'System', light: 'Light', dark: 'Dark' };

    function currentMode() {
        return document.documentElement.getAttribute('data-theme-mode') || 'system';
    }

    function updateLabel() {
        var mode = currentMode();
        btn.setAttribute('aria-label', 'Theme: ' + LABELS[mode] + '. Click to switch theme.');
        btn.title = 'Theme: ' + LABELS[mode];
    }

    updateLabel();

    btn.addEventListener('click', function () {
        var next = MODES[(MODES.indexOf(currentMode()) + 1) % MODES.length];
        window.__setThemeMode(next);
        updateLabel();
    });
})();
</script>
